[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundseal"
version = "0.1.0"
description = "Controlled command-execution boundary for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["groundseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
